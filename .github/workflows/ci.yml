name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  prebuilt:
    name: prebuilt (${{ matrix.system }})
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
              && !contains(github.event.head_commit.message, 'record prebuilt hashes')))
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            system: aarch64-darwin
            target: aarch64-apple-darwin
          - os: macos-latest
            system: x86_64-darwin
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: prebuilt-${{ matrix.system }}
      - name: Build release binary
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: tar -czf "shpell-${{ matrix.system }}.tar.gz" -C target/${{ matrix.target }}/release shpell
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.system }}
          path: shpell-${{ matrix.system }}.tar.gz

  publish-prebuilt:
    name: publish prebuilt
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
              && !contains(github.event.head_commit.message, 'record prebuilt hashes')))
    needs: [prebuilt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release and record hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          tag=prebuilt

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Prebuilt binaries" --prerelease \
              --notes "CI binaries for \`nix profile add github:yangtau/shpell\`. Assets are \`shpell-<system>-<git-sha>.tar.gz\`."
          fi

          for archive in dist/shpell-*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            named="dist/${name}-${sha}.tar.gz"
            cp "$archive" "$named"
            gh release upload "$tag" "$named" --clobber
          done

          python3 - "$sha" <<'PY'
          import base64, hashlib, json, sys
          from pathlib import Path

          def sri(path):
              digest = hashlib.sha256(Path(path).read_bytes()).digest()
              return "sha256-" + base64.b64encode(digest).decode()

          sha = sys.argv[1]
          systems = [
              "aarch64-darwin",
              "aarch64-linux",
              "x86_64-darwin",
              "x86_64-linux",
          ]
          Path("nix/prebuilt-hashes.json").write_text(
              json.dumps(
                  {
                      "rev": sha,
                      "hashes": {system: sri(f"dist/shpell-{system}.tar.gz") for system in systems},
                  },
                  indent=2,
              )
              + "\n"
          )
          PY

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$sha" ]; then
            echo "main moved to $(git rev-parse origin/main); not recording hashes"
            exit 0
          fi

          # Drop assets from older commits so the rolling release stays small.
          while read -r asset; do
            case "$asset" in
              *"$sha"*) ;;
              "") ;;
              *) gh release delete-asset "$tag" "$asset" --yes ;;
            esac
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/prebuilt-hashes.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(nix): record prebuilt hashes for ${sha:0:7}"
          git push origin HEAD:main

  release-build:
    name: release-build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # native build on the free arm64 Linux runner
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # no apt musl cross-toolchain for armv7 — link with zig instead
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            zigbuild: true
          - os: macos-latest
            target: aarch64-apple-darwin
          # cross-compiled on the arm64 runner — macos-13 (the last x86_64
          # runner image) queues for a long time
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux' && !matrix.zigbuild
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        run: pip3 install cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo ${{ matrix.zigbuild && 'zigbuild' || 'build' }} --release --locked --target ${{ matrix.target }}
      - name: Package
        run: tar czf shpell-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release shpell
      - uses: actions/upload-artifact@v4
        with:
          name: shpell-${{ matrix.target }}
          path: shpell-${{ matrix.target }}.tar.gz

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
